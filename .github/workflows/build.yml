name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'DATA-VERSION']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the app files
        type: boolean
        default: true
  schedule:
    - cron: '17 3 1 * *'

permissions: {}

jobs:
  data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests
        run: node --test test/
      - name: Build data
        run: node build/build-data.mjs
      - name: Verify data
        run: node build/verify-data.mjs
      - name: Acceptance queries
        run: |
          node tools/query.mjs --accept | tee "$RUNNER_TEMP/accept.txt"
          if grep -q '^FAIL' "$RUNNER_TEMP/accept.txt"; then echo "::error::an acceptance query failed"; exit 1; fi
          grep -qE '^([0-9]+)/\1 pass$' "$RUNNER_TEMP/accept.txt"
      - name: Stamp service worker version
        id: meta
        run: |
          STAMP="$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}"
          if [ "$(grep -c "^const SHELL_VERSION = '[^']*';\$" app/sw.js)" != 1 ]; then
            echo "::error::line const SHELL_VERSION = '...'; not found exactly once in app/sw.js"; exit 1
          fi
          sed -i "s/^const SHELL_VERSION = '[^']*';\$/const SHELL_VERSION = '$STAMP';/" app/sw.js
          grep -n '^const SHELL_VERSION' app/sw.js
          echo "date=$(node -p "require('./app/data/version.json').built")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: app/
          if-no-files-found: error
          retention-days: 7

  pages:
    needs: data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  android:
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NJ_DATE: ${{ needs.data.outputs.date }}
    defaults:
      run:
        working-directory: packaging/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: packaging/android/www
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap add android
      - run: npx cap sync android
      - name: Launcher icons
        run: |
          mkdir -p assets
          cp www/icons/icon-512.png assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#2f7d4f' --iconBackgroundColorDark '#2f7d4f'
      - name: Version, large heap, signing config
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -f android/app/build.gradle
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s//<application android:largeHeap="true"/' "$MANIFEST"
          grep -q 'android:largeHeap="true"' "$MANIFEST"
          cat >> android/app/build.gradle <<EOF

          android {
              defaultConfig {
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName "${NJ_DATE//-/.}"
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("NJ_KEYSTORE"))
                      storePassword System.getenv("NJ_KEYSTORE_PASSWORD")
                      keyAlias "nearestjisho"
                      keyPassword System.getenv("NJ_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' >> android/gradle.properties
      - name: Build release APK
        working-directory: packaging/android/android
        env:
          NJ_KEYSTORE: ${{ runner.temp }}/release.jks
          NJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify signature and permissions
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep 'certificate DN'
          PERMS=$("$BT/aapt2" dump permissions "$APK" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p")
          echo "permissions: $PERMS"
          BAD=$(echo "$PERMS" | grep '^android\.permission\.' | grep -vx 'android.permission.INTERNET' || true)
          if [ -n "$BAD" ]; then echo "::error::unexpected permissions: $BAD"; exit 1; fi
          mkdir -p out
          cp "$APK" "out/nearest-jisho-$NJ_DATE.apk"
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: packaging/android/out/*.apk
          if-no-files-found: error
          compression-level: 0

  desktop:
    needs: data
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      NJ_DATE: ${{ needs.data.outputs.date }}
    defaults:
      run:
        shell: bash
        working-directory: packaging/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: packaging/tauri/www
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/tauri/src-tauri -> target
      - name: Linux build packages (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - name: Icons and version
        run: |
          npx tauri icon www/icons/icon-512.png
          node -e "
            const fs = require('fs'), f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.NJ_DATE.split('-').map(Number).join('.');
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
            console.log('version', c.version);
          "
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npx tauri build --bundles appimage
      - name: Collect output
        run: |
          B=src-tauri/target/release/bundle
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            ls -l "$B/nsis"
            cp "$B"/nsis/*-setup.exe "out/nearest-jisho-$NJ_DATE-windows-setup.exe"
          else
            ls -l "$B/appimage"
            cp "$B"/appimage/*.AppImage "out/nearest-jisho-$NJ_DATE-linux.AppImage"
            chmod +x out/*.AppImage
          fi
          ls -l out
      - name: Smoke test (Windows, unpacked exe next to its resources)
        if: runner.os == 'Windows'
        run: |
          ls src-tauri/target/release/web/data
          node smoke.mjs src-tauri/target/release/nearest-jisho.exe
      - name: Smoke test (Linux, AppImage)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          RUN=""
          command -v dbus-run-session > /dev/null && RUN="dbus-run-session --"
          $RUN xvfb-run -a node smoke.mjs "$PWD/out/nearest-jisho-$NJ_DATE-linux.AppImage" --appimage-extract-and-run
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: packaging/tauri/out/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [data, android, desktop]
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NJ_DATE: ${{ needs.data.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: files
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files
      - name: Publish release
        run: |
          ls -l files
          if [ "$(ls files | wc -l)" != 3 ]; then echo "::error::expected 3 files"; exit 1; fi
          TAG="data-$NJ_DATE"
          if gh release view "$TAG" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            TAG="$TAG-$GITHUB_RUN_NUMBER"
          fi
          sed "s/@DATE@/$NJ_DATE/g" packaging/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" files/* --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest
          echo "released $TAG"

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Write the date into DATA-VERSION and push
        env:
          TZ: UTC
        run: |
          date -u +%Y-%m-%d > DATA-VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DATA-VERSION
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'data: monthly refresh [skip ci]'
          git push
